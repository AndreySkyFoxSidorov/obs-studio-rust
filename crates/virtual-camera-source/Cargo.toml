[package]
name = "skylive-virtual-camera-source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "skylive_virtual_camera_source"
crate-type = ["cdylib"]

[dependencies]
skylive-virtual-camera-protocol = { path = "../virtual-camera-protocol" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "=0.58.0"
windows = { version = "=0.58.0", features = ["implement", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Media_KernelStreaming", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
